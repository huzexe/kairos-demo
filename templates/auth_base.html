{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Kairos</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}"><link rel="stylesheet" href="{% static 'css/base.css' %}"><link rel="stylesheet" href="{% static 'css/layout.css' %}"><link rel="stylesheet" href="{% static 'css/components.css' %}"><link rel="stylesheet" href="{% static 'css/pages/screens.css' %}">
</head>
<body>
<div class="auth">
  <section class="auth-side">
    <div class="auth-word">Kairos</div>
    <p class="auth-line">Your clients. Your computer. Your data.</p>
  </section>
  <main class="auth-main"><div class="auth-box">{% block content %}{% endblock %}</div></main>
</div>
{% include "includes/messages.html" %}
<script src="{% static 'js/kairos.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
