{% if has_data %}<figure class="chart" aria-label="{{ label }}">
  <div class="area" aria-hidden="true">
    <svg viewBox="0 0 600 160" preserveAspectRatio="none"><path class="area-fill" d="{{ area }}"/><path class="area-line" d="{{ line }}"/></svg>
    <span class="area-end" style="left:{{ end_x }}%;top:{{ end_y }}%"></span>
    <div class="area-hits">{% for r in rows %}<span data-tip="{{ r.tip }}"></span>{% endfor %}</div>
  </div>
  <div class="area-x" aria-hidden="true"><span>{{ first }}</span><span>{{ last }}</span></div>
  <div class="sr-only"><table><caption>{{ label }}</caption><tbody>{% for r in rows %}<tr><th scope="row">{{ r.label }}</th><td>{{ r.tip }}</td></tr>{% endfor %}</tbody></table></div>
</figure>{% else %}{% include "charts/_empty.html" %}{% endif %}
