name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -r requirements.txt pytest pytest-django
      - name: Check
        run: python manage.py check
      - name: Test
        run: python -m pytest
      - name: Launcher starts and serves the setup page
        shell: bash
        run: |
          python start.py --no-browser --port 8765 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/setup/ || true)
            [ "$code" = "200" ] && echo "launcher OK" && exit 0
            sleep 2
          done
          echo "launcher did not start" && exit 1
