{# Asks why a lead was lost. Used by the board (JavaScript) and the lead page. #}
<dialog class="modal" id="lost-dialog" aria-labelledby="lost-title">
  <form method="post" id="lost-form"{% if lead %} action="{% url 'pipeline:lead_move' lead.pk %}"{% endif %}>
    {% csrf_token %}
    <input type="hidden" name="stage" value="lost">
    <div class="dialog-head"><h3 id="lost-title">Why was this lead lost?</h3></div>
    <div class="dialog-body">
      <div class="reason-list">
        {% for r in lost_reasons %}
        <label class="check"><input type="radio" name="lost_reason" value="{{ r.pk }}" required> <span dir="auto">{{ r.name }}</span></label>
        {% empty %}
        <p class="muted">No lost reasons yet. Add some in Settings → Lost reasons.</p>
        {% endfor %}
      </div>
      <label class="field"><span class="field-label">Note (optional)</span>
        <input class="input" type="text" id="lost-note" name="lost_note" maxlength="300" dir="auto" placeholder="e.g. Budget was half our starter package"></label>
    </div>
    <div class="dialog-foot">
      <button class="btn btn-ghost" type="button" value="cancel" data-cancel>Cancel</button>
      <button class="btn btn-danger" type="submit">Mark as lost</button>
    </div>
  </form>
</dialog>
